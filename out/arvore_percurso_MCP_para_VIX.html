<html>
<head>
  <meta charset="utf-8">

  <script src="lib/bindings/utils.js"></script>

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/dist/vis-network.min.css"
        crossorigin="anonymous"
        referrerpolicy="no-referrer" />

  <script src="https://cdnjs.cloudflare.com/ajax/libs/vis-network/9.1.2/dist/vis-network.min.js"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"></script>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css"
        rel="stylesheet"
        crossorigin="anonymous" />

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.bundle.min.js"
          crossorigin="anonymous"></script>

  <style type="text/css">
    #mynetwork {
      width: 100%;
      height: 600px;
      background-color: #ffffff;
      border: 1px solid lightgray;
      position: relative;
      float: left;
    }
  </style>
</head>

<body>
  <div class="card" style="width: 100%">
    <div id="mynetwork" class="card-body"></div>
  </div>

  <script type="text/javascript">
    var edges;
    var nodes;
    var allNodes;
    var allEdges;
    var nodeColors;
    var network;
    var data;

    function drawGraph() {
      var container = document.getElementById('mynetwork');

      nodes = new vis.DataSet([
        {
                "color": "#90EE90",
                "font": {
                        "color": "black"
                },
                "id": "MCP",
                "label": "MCP",
                "shape": "dot",
                "size": 25,
                "title": "aeroportoporto MCP"
        },
        {
                "color": "#90EE90",
                "font": {
                        "color": "black"
                },
                "id": "BSB",
                "label": "BSB",
                "shape": "dot",
                "size": 25,
                "title": "aeroportoporto BSB"
        },
        {
                "color": "#90EE90",
                "font": {
                        "color": "black"
                },
                "id": "VIX",
                "label": "VIX",
                "shape": "dot",
                "size": 25,
                "title": "aeroportoporto VIX"
        }
]);

      edges = new vis.DataSet([
        {
                "color": "#90EE90",
                "from": "MCP",
                "label": "165.0",
                "to": "BSB",
                "width": 4,
                "length": 250
        },
        {
                "color": "#90EE90",
                "from": "BSB",
                "label": "80.0",
                "to": "VIX",
                "width": 4,
                "length": 250
        }
]);

      nodeColors = {};
      allNodes = nodes.get({ returnType: "Object" });

      for (nodeId in allNodes) {
        nodeColors[nodeId] = allNodes[nodeId].color;
      }

      allEdges = edges.get({ returnType: "Object" });

      data = {
        nodes: nodes,
        edges: edges
      };

      var options = {
        "configure": {
          "enabled": false
        },
        "edges": {
          "color": {
            "inherit": false
          },
          "smooth": {
            "enabled": true,
            "type": "dynamic"
          },
          "font": {
            "color": "black",
            "size": 16
          }
        },
        "interaction": {
          "dragNodes": true,
          "hideEdgesOnDrag": false,
          "hideNodesOnDrag": false
        },
        "physics": {
          "enabled": true,
          "stabilization": {
            "enabled": true,
            "fit": true,
            "iterations": 1000,
            "onlyDynamicEdges": false,
            "updateInterval": 50
          }
        }
      };

      network = new vis.Network(container, data, options);

      return network;
    }

    drawGraph();
  </script>
</body>
</html>
